.in{animation:in .9s cubic-bezier(.2,.8,.2,1) both} @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.5,.5,1) both} @keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.fl{animation:fl 5s ease-in-out infinite} @keyframes fl{50%{transform:translateY(-8px)}}
.pu{animation:pu 2.4s ease-in-out infinite} @keyframes pu{50%{opacity:.35}}
.dr1{animation:dr1 14s ease-in-out infinite} @keyframes dr1{50%{transform:translate(60px,30px)}}
.dr2{animation:dr2 18s ease-in-out infinite} @keyframes dr2{50%{transform:translate(-70px,-20px)}}
.dr3{animation:dr3 16s ease-in-out infinite} @keyframes dr3{50%{transform:translate(40px,-40px)}}

</style></defs>
